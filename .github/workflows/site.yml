# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Builds the site, the Python API reference included, in the devenv shell
# and publishes it with one new commit on the gh-pages branch, which GitHub Pages serves.
# A release tag publishes; a manual run is for changes to the site between releases.
name: site

on:
  push:
    tags: ['kernel-*', 'ocaml-*', 'py-*']
  workflow_dispatch:

permissions:
  contents: write  # site-publish.sh pushes to gh-pages

# One publish at a time.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The site states `git describe --tags`, which wants the history
          # and the tags.
          fetch-depth: 0

      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: The tag names a stated version
        if: github.ref_type == 'tag'
        run: git submodule update --init djot && make check-versions TAG=${{ github.ref_name }}

      # site-publish.sh makes the commit with git commit-tree.
      - name: Set the git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and publish the site
        run: devenv shell -- make site-publish
