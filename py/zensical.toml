# ai-disclosure: ai-generated

[project]
site_name = "djotv"
site_description = "djot, parsed and rendered by the verified parser of djot.v"
repo_url = "https://github.com/hon-gyu/djot.v"
edit_uri = "edit/main/py/docs/"
# `_build/` is ignored at the root of the repository.
site_dir = "_build/docs"
nav = [
  { "Home" = "index.md" },
  # The rest of the site, when built into its api/python/ by `make site`.
  { "djot.v site" = "../../" },
  { "API reference" = [
    { "djotv" = "api/djotv.md" },
    { "djotv.ast" = "api/ast.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}

# API reference
# =============

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
# The docstrings are prose with no Args/Returns sections; the Google parser
# leaves such text alone.
docstring_style = "google"
filters = ["!^_"]
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
show_root_heading = true
show_root_full_path = false
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
# Most node classes in `djotv.ast` have no docstring; their fields are the doc.
show_if_no_docstring = true
