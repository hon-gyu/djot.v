[project]
name = "djotv"
version = "0.1.0"
description = "djot, parsed and rendered by the verified parser of djot.v"
readme = "README.md"
authors = [
    { name = "hongyu", email = "linerwang1997@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "wasmtime>=49.0.0",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]
